<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>NapCat</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(120% 120% at 20% 0%, #17202e 0%, #0b0d12 60%);
    color: #e8edf5;
    -webkit-user-select: none;
  }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .logo { width: 84px; height: 84px; filter: drop-shadow(0 8px 24px rgba(90,150,255,.35)); }
  .title { font-size: 17px; font-weight: 600; letter-spacing: .5px; }
  .title span { color: #6ea8ff; }
  .status { font-size: 13px; color: #b9c4d4; height: 18px; }
  .sub { font-size: 11.5px; color: #7a8798; height: 16px; text-align: center; padding: 0 24px; }
  .bar { width: 210px; height: 3px; border-radius: 3px; background: #1d2432; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #3d7bff, #6ec1ff); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(350%);} }
</style>
</head>
<body>
  <img class="logo" src="../build/logo.png" alt="NapCat" />
  <div class="title">NapCat <span>Desktop</span></div>
  <div class="bar"><i></i></div>
  <div class="status" id="status">正在启动…</div>
  <div class="sub" id="sub"></div>
<script>
  window.napcat && window.napcat.onStatus(({ text, sub }) => {
    document.getElementById('status').textContent = text
    document.getElementById('sub').textContent = sub || ''
  })
  window.addEventListener('DOMContentLoaded', () => window.napcat && window.napcat.ready())
</script>
</body>
</html>
